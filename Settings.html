<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Settings | Dashboard</title>
    <!-- SEO Meta Tags -->
    <meta name="description" content="Configure display themes, update staff contact details, adjust security notification channels, and reset platform settings.">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts - Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Custom Unified CSS -->
    <link rel="stylesheet" href="Style/CSS/Dashboard.css">
</head>
<body>
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <img src="Images/buksu-logo.png" alt="Penaflorida Logo" class="logo">
            <span class="sidebar-title">Penaflorida</span>
        </div>
        
        <nav class="sidebar-nav">
            <a href="Index.html" class="nav-link" id="nav-dashboard">
                <i class="fas fa-tachometer-alt"></i>
                <span>Dashboard</span>
            </a>
            <a href="Products.html" class="nav-link" id="nav-products">
                <i class="fas fa-box"></i>
                <span>Products</span>
            </a>
            <a href="Reports.html" class="nav-link" id="nav-reports">
                <i class="fas fa-chart-bar"></i>
                <span>Reports</span>
            </a>
            <a href="Accounts.html" class="nav-link" id="nav-accounts">
                <i class="fas fa-users"></i>
                <span>Accounts</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <a href="Settings.html" class="nav-link active" id="nav-settings">
                <i class="fas fa-cog"></i>
                <span>Settings</span>
            </a>
            <a href="Logout.html" class="nav-link logout-link" id="nav-logout">
                <i class="fas fa-sign-out-alt"></i>
                <span>Sign Out</span>
            </a>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
        <!-- Top Navigation Bar -->
        <header class="topbar">
            <div class="d-flex align-items-center gap-3">
                <button class="mobile-toggle" aria-label="Toggle Sidebar" id="hamburger-menu">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Search parameters..." aria-label="Search settings parameters" id="global-search">
                </div>
            </div>

            <div class="user-menu">
                <div class="dropdown">
                    <button class="dropdown-toggle" type="button" id="userDropdown" aria-expanded="false">
                        <img src="Images/hacker.png" alt="Neil Admin Avatar" class="user-avatar">
                        <span class="user-name d-none d-sm-inline">Neil Hacker</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                        <li><a class="dropdown-item" href="Settings.html"><i class="fas fa-user-cog"></i>Profile Settings</a></li>
                        <li><a class="dropdown-item" href="Settings.html"><i class="fas fa-palette"></i>Theme Settings</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="Logout.html"><i class="fas fa-sign-out-alt"></i>Sign Out</a></li>
                    </ul>
                </div>
            </div>
        </header>

        <!-- Page Content -->
        <div class="content animate-fade-in delay-1">
            <div class="d-flex justify-content-between align-items-md-center flex-column flex-md-row mb-4 gap-3">
                <div>
                    <h1 class="page-title">Configuration Board</h1>
                    <p class="page-subtitle">Configure administrative preferences, themes, security notifications, and details.</p>
                </div>
            </div>

            <div class="row g-4">
                <!-- Visual Display Themes card -->
                <div class="col-12 col-md-6">
                    <div class="card h-100">
                        <div class="card-header">
                            <h5><i class="fas fa-palette me-2"></i>Display & Appearance</h5>
                        </div>
                        <div class="card-body">
                            <div class="mb-4">
                                <label for="themeSelect" class="form-label">Active Theme Mode</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-moon"></i></span>
                                    <select class="form-select" id="themeSelect">
                                        <option value="light">Light Mode</option>
                                        <option value="dark">Dark Mode</option>
                                        <option value="system">Follow Operating System</option>
                                    </select>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label for="colorScheme" class="form-label">Accent Highlight Scheme</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-fill-drip"></i></span>
                                    <select class="form-select" id="colorScheme">
                                        <option value="cyan">Neon Cyan Glow (Default)</option>
                                        <option value="purple">Royal Violet Glass</option>
                                        <option value="emerald">Spring Emerald Gloss</option>
                                    </select>
                                </div>
                            </div>
                            <div class="form-check form-switch mb-3">
                                <input class="form-check-input" type="checkbox" id="darkModeToggle" checked>
                                <label class="form-check-label" for="darkModeToggle">Instantly force premium Dark Mode backdrop</label>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Account profile variables card -->
                <div class="col-12 col-md-6">
                    <div class="card h-100">
                        <div class="card-header">
                            <h5><i class="fas fa-user-cog me-2"></i>Staff Credentials</h5>
                        </div>
                        <div class="card-body">
                            <div class="mb-3">
                                <label for="username" class="form-label">Username (Read-Only)</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-user"></i></span>
                                    <input type="text" class="form-control" id="username" value="Neil" disabled>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Contact Address</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                                    <input type="email" class="form-control" id="email" value="neil@example.com">
                                </div>
                            </div>
                            <div class="mb-4">
                                <label for="timezone" class="form-label">Timezone Location</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-globe"></i></span>
                                    <select class="form-select" id="timezone">
                                        <option value="UTC+08:00" selected>(UTC+08:00) Manila, Singapore, Kuala Lumpur</option>
                                        <option value="UTC+00:00">(UTC+00:00) London, Lisbon, Casablanca</option>
                                        <option value="UTC-05:00">(UTC-05:00) New York, Toronto, Bogota</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Broadcast channel switches card -->
                <div class="col-12">
                    <div class="card">
                        <div class="card-header">
                            <h5><i class="fas fa-bell me-2"></i>Security Notification Preferences</h5>
                        </div>
                        <div class="card-body">
                            <div class="row g-3">
                                <div class="col-12 col-md-6">
                                    <div class="form-check form-switch mb-3">
                                        <input class="form-check-input" type="checkbox" id="emailNotifications" checked>
                                        <label class="form-check-label" for="emailNotifications">Deliver security logs to administrative email weekly</label>
                                    </div>
                                    <div class="form-check form-switch mb-3">
                                        <input class="form-check-input" type="checkbox" id="pushNotifications" checked>
                                        <label class="form-check-label" for="pushNotifications">Enable system push alerts for high priority updates</label>
                                    </div>
                                </div>
                                <div class="col-12 col-md-6">
                                    <div class="form-check form-switch mb-3">
                                        <input class="form-check-input" type="checkbox" id="orderUpdates" checked>
                                        <label class="form-check-label" for="orderUpdates">Notify upon new transactional order placement</label>
                                    </div>
                                    <div class="form-check form-switch mb-3">
                                        <input class="form-check-input" type="checkbox" id="promotionalEmails">
                                        <label class="form-check-label" for="promotionalEmails">Receive marketing summaries and software news alerts</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Action Button Row -->
                <div class="col-12 mt-4">
                    <div class="d-flex justify-content-end gap-3 flex-wrap">
                        <button class="btn btn-outline-secondary">
                            <i class="fas fa-undo me-2"></i>Restore Defaults
                        </button>
                        <button class="btn btn-primary">
                            <i class="fas fa-save me-2"></i>Save Changes
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap 5 JavaScript Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <!-- Custom Interactive JS -->
    <script src="Style/JS/Dashboard.js"></script>
</body>
</html>
